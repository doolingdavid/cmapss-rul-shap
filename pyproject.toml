[project]
name = "sandia-talk-hai"
version = "0.2.0"
description = "CMAPSS turbofan RUL classification + native LightGBM SHAP, for the Sandia interview talk"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=16",
    "numpy>=2.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.5",
    "streamlit>=1.36,<1.58",
    "plotly>=5.22",
    "hiplot>=0.1.33",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[tool.uv]
package = false
